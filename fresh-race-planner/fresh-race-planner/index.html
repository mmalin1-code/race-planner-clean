<!doctype html>
<html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Race Planner</title>
<link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'/><script src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'></script>
<style>html,body,#map{height:100%;margin:0}#panel{position:absolute;z-index:1000;top:10px;left:10px;background:#fff;padding:8px;border-radius:8px;max-width:260px}</style></head>
<body><div id='panel'><strong>Race Planner (clean repo)</strong><br/><small>Click to draw your route.</small><br/><button id='clear'>Clear</button></div><div id='map'></div>
<script>
const map=L.map('map').setView([38.63,-90.2],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const line=L.polyline([],{color:'#007aff',weight:5}).addTo(map);
map.on('click',e=>line.addLatLng(e.latlng));
document.getElementById('clear').onclick=()=>line.setLatLngs([]);
</script></body></html>
